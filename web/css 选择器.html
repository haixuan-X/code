<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css 选择器</title>
    <style>
        /* 这是一个元素选择器 */
        h2 {
            color: red;
            font-size: 20px;
        }
        /* 这是一个类选择器 */
        .highlight {
            color: green;
            font-size: 20px;
        }
        /* 这是一个ID选择器 */
        #header {
            color: blue;
            font-size: 20px;
        }
        /* 这是通用选择器 */
        * {
            font-family: 'KaiTi';
            font-size: 30px;
        }
        /* 这是一个子元素选择器 */
        .father > .son {
            color: purple;
            font-size: 20px;
        }
        /* 这是一个后代选择器 */
        .father p {
            color: orange;
            font-size: 20px;
        }
        /* 这是一个相邻兄弟选择器 */
        h3 + p {
            color: brown;
            font-size: 20px;
        }
        /* 这是一个伪类选择器 */
        a:hover {
            color: red;
        }
    </style>
</head>
<body>

    <h1>不同类型的css选择器</h1>
    <h2>这是一个元素选择器</h2>
    <h3 class="highlight">这是一个类选择器示例</h3>
    <h3>这是另一个类选择器示例</h3>
    <h4 id="header">这是一个ID选择器示例</h4>

    <div class="father">
        <p class="son">这是一个子元素选择器示例</p>
        <div>
            <p class="grandson">这是一个后代选择器示例</p>
        </div>
    </div>

    <p>这是一个普通的p标签</p>
    <h3>这是一个相邻兄弟的选择器示例</h3>
    <p>这是另一个p标签</p>

    <a>这是一个伪类选择器示例</a>
</body>
</html>
