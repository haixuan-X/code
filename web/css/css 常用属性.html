<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css 常用属性</title>
    <style>
        .block {
            background-color: aqua;
            width: 150px;
            height: 150px;
        }
        
        .inline {
            background-color: yellow;
        }

        .inline-block {
            width:150px;
        }

        .div-inline {
            display: inline;
            background-color: red;
            width: 150px;
            height: 150px;
        }

        .span-inline-block {
            display: inline-block;
            background-color: blue;
            width: 150px;
            height: 150px;
        }

    </style>
</head>

<body>
    <h1 style="font: bolder 50px 'KaiTi';">这是一个font复合属性</h1>
    <p style="line-height: 40px;">这是一个line-height属性示例这是一个line-height属性示例这是一个line-height属性示例这是一个line-height属性示例这是一个line-height属性示例这是一个line-height属性示例这是一个line-height属性示例这是一个line-height属性示例</p>
    
    <div class="block">这是一个块级元素</div>
    <span class="inline">这是一个行内元素</span>
    <img src="tx.jpg" alt="图片" class="inline-block">

    <h3>display属性</h3>
    <div class="div-inline">这是一个转换成行内元素的div</div>
    <span class="span-inline-block">这是一个转换成行内块元素的span</span>
</body>

</html>
