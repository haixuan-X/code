<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css 浮动</title>
    <style>
        .father{
            background-color: yellow;
            height: 150px;
            border: 5px solid brown;
            /* 清除坍塌 */
            /* overflow: hidden; */
        }

        .left-son{
            width: 100px;
            height: 100px;
            background-color: aqua;
            float: left;
        }

        .right-son{
            width: 100px;
            height: 100px;
            background-color: blueviolet;
            float: right;
        }
    </style>
</head>
<body>
    <div class="father">
        <div class="left-son">左浮动</div>
        <div class="right-son">右浮动</div>
    </div>
</body>
</html>
