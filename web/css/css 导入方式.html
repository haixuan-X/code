<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS导入方式</title>
    <link rel="stylesheet" href="style.css">
    <style>
        p {
            color:aquamarine;
            font-style: 16px;
        }
        h2 {
            color: green;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <!-- 内联样式>内部样式>外部样式 -->
    <p>这是一个应用了css样式的文本</p>
    <h1 style="color:red; font-size: 24px;">这是一个标题,使用内联样式</h1>
    <h2>这是一个标题,使用内部样式</h2>
    <h3>这是一个标题,使用外部样式</h3>
</body>

</html>
