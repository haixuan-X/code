<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js函数</title>
</head>

<body>
    <script>
        function hello(){
            console.log('Hello, World!');
        }
        hello();

        function hello_with_return(){
            return 'hello,world! - 返回值';
        }
        let a = hello_with_return();
        console.log(a)

        function hello_with_params(name){
            console.log('hello, ' + name)
        }
        hello_with_params('test');

        function hello_test(test){
            return '测试成功, '+ test;
        }
        let b = hello_test('你真牛逼');
        console.log (b)
        
        //作用域

        let global_var = '全局变量';
        function local_var_function(){
            let local_var = '局部变量';
            console.log('函数内全局变量' + global_var);
            console.log('函数内局部变量' + local_var);
        }

        local_var_function();

        console.log('全局全局变量' + global_var);
        console.log('全局内局部变量' + local_var);
        
    </script>
</body>

</html>
